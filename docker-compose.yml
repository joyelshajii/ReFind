services:
  db:
    image: pgvector/pgvector:pg16
    container_name: refind_postgres
    restart: always
    environment:
      POSTGRES_DB: refind_db
      POSTGRES_USER: refind_user
      POSTGRES_PASSWORD: refind_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refind_user -d refind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
